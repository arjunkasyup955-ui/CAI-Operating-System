name: mcp_agent
responsibilities:
  - Provide Model Context Protocol server connectivity - health check, server
    discovery, session management (connect/disconnect), remote tool discovery and
    execution, resource reading, and prompt execution - on behalf of the
    Manager/Claude Code Agent
inputs:
  - operation name + operation-specific arguments (server_name, session_id,
    tool_name, resource_uri, prompt_name, arguments)
outputs:
  - MCPOperationResult (success, operation, session_id, servers, tools, content,
    error)
tools:
  - mcp_health_check
  - mcp_list_servers
  - mcp_connect_server
  - mcp_disconnect_server
  - mcp_list_tools
  - mcp_call_tool
  - mcp_read_resource
  - mcp_execute_prompt
permissions:
  - internet_access
supervisor: manager
lifecycle: active
version: "0.1.0"
