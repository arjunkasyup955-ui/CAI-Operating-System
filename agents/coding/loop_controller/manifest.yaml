name: loop_controller_agent
responsibilities:
  - Run long-running, multi-step workflows with pause/resume/cancel, automatic retry
    of failed steps within a fixed budget, progress tracking, and hard max-iteration
    and timeout limits so no loop can run forever
  - Persist loop state through the real LangGraph checkpointer (Memory Gateway) so a
    loop can be recovered after a process interruption, not just paused in-memory
inputs:
  - steps (list of step descriptors), max_iterations, timeout_seconds, retry_budget
outputs:
  - loop state snapshot (status, current_step_index, iteration_count, progress, error)
tools:
  - execute_loop_step
permissions:
  - shell_exec
supervisor: manager
lifecycle: active
version: "0.1.0"
