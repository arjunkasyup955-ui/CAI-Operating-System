[project]
name = "afos"
version = "0.1.0"
description = "AFOS - AI Founder Operating System"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.3.12",
    "langchain-core==1.4.9",
    "langgraph==1.2.8",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.2",
    "langsmith==0.10.1",
    "openai==2.45.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "tenacity==9.1.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "workflows*", "tools*"]
